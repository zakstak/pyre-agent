# Generated by pragma — https://github.com/zakstak/pragma
# To regenerate: ~/.pragma/install.sh <target-repo>

[[repos]]
repo = "local"

[[repos.hooks]]
id = "format"
name = "format"
entry = ".pragma-hooks/format.sh"
language = "script"
files = '\.(go|rs|ts|tsx|js|jsx|html|htm|yml|yaml|sh|md|toml|json|py)$'
exclude = '(^tests/fixtures/|(^|/)pnpm-lock\.yaml$)'
stages = ["pre-commit"]

[[repos.hooks]]
id = "lint"
name = "lint"
entry = ".pragma-hooks/lint.sh"
language = "script"
files = '(\.(go|rs|ts|tsx|js|jsx|yml|yaml|sh|toml|py)$)|((^|/)([Dd]ockerfile(\.[^/]+)?|[^/]+\.[Dd]ockerfile)$)'
stages = ["pre-commit"]

[[repos.hooks]]
id = "kingfisher"
name = "kingfisher"
entry = ".pragma-hooks/secrets.sh"
language = "script"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

[[repos.hooks]]
id = "test"
name = "test"
entry = ".pragma-hooks/test.sh"
language = "script"
pass_filenames = false
always_run = true
stages = ["pre-push"]

# Preserve the plugin's staged skill-version guard alongside Pragma.
[[repos.hooks]]
id = "skill-versions"
name = "skill versions"
entry = "python3 tests/check_skill_versions.py --staged --base origin/main"
language = "system"
pass_filenames = false
always_run = true
stages = ["pre-commit"]

# Pragma discovers root manifests; this package lives below packages/.
[[repos.hooks]]
id = "review-canvas"
name = "review canvas typecheck, build, and tests"
entry = ".pragma-hooks/review-canvas.sh"
language = "script"
pass_filenames = false
always_run = true
stages = ["pre-push"]

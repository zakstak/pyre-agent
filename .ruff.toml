# The review-canvas skill and its standard-library scripts support Python 3.10+.
# In 3.10, UTC uses timezone.utc and fromisoformat needs Z normalized to +00:00.
target-version = "py310"

# The host-specific Codex bridge explicitly requires Python 3.11+.
[per-file-target-version]
"host-skills/claude-code/codex-branch-review/scripts/*.py" = "py311"

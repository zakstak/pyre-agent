[package]
name = "session-resources"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Passive CPU, memory, and GPU memory accounting for T3 Code agent sessions."
license = "MIT"
publish = false

[dependencies]
askama = "0.16.1"
clap = { version = "4.6.9", features = ["derive"] }
libc = "0.2.191"
libloading = "0.9.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

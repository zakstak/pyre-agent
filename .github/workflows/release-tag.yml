name: Release tag

# Hosts install pyre-agent from main, so a merged version raise is a release. Tag it as vMAJOR.MINOR.PATCH on the
# commit that raised it, with the commit's subject in the tag message.
on:
  push:
    branches: [main]
    paths:
      - .claude-plugin/plugin.json
      - .codex-plugin/plugin.json
      - .antigravity-plugin/plugin.json

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Tag the release
        run: |
          set -euo pipefail
          versions="$(jq -r .version .claude-plugin/plugin.json .codex-plugin/plugin.json .antigravity-plugin/plugin.json | sort -u)"
          if [[ "$(printf '%s\n' "$versions" | wc -l)" -ne 1 ]]; then
            printf 'The plugin manifests disagree on the version:\n%s\n' "$versions" >&2
            exit 1
          fi
          tag="v$versions"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            printf '%s already tags %s.\n' "$tag" "$(git rev-list -n 1 "$tag")"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Pyre Agent $versions: $(git log -1 --format=%s "$GITHUB_SHA")" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

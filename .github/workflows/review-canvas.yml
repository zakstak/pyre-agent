name: Review canvas server

on:
  pull_request:
    paths:
      - packages/review-canvas/**
      - skills/internal-visual-style/**
      - .github/workflows/review-canvas.yml

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest runs on Apple Silicon, the only Macs the server supports.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/review-canvas
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: packages/review-canvas/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: packages/review-canvas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
